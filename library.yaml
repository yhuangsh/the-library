default_dirs:
  skills:
    - default: .pi/skills/
    - global: ~/.pi/agent/skills/
  agents:
    - default: .pi/extensions/
    - global: ~/.pi/agent/extensions/
  prompts:
    - default: .pi/prompts/
    - global: ~/.pi/agent/prompts/

library:
  skills:
    - name: sandbox-exe-dev
      description: "Operate exe.dev persistent VMs via SSH/HTTPS for safe code execution and file operations. Use when the user needs persistent dev environments, SSH-accessible Linux VMs, or web-exposed sandboxes. Keywords: exe.dev, persistent VM, SSH, code execution, sandbox, exedev."
      source: https://github.com/disler/inkwell-agent-sandboxes-and-software-factory/blob/main/.claude/skills/sandbox-exe-dev/SKILL.md
      # self-contained (bundles exedev_cli/); /agent-sandboxes is an E2B cousin, not a hard dependency

    - name: sssf
      description: "Super Simple Software Factory — deploy and operate repeatable agents+code workflows (ADWs) in any codebase. Use when the user says /sssf install, wants to create/run/update an ADW, manage the agent roster in sssf.config.yaml, or observe running agent workflows. Keywords - sssf, software factory, ADW, AI developer workflow, agent pipeline, install factory."
      source: https://github.com/yhuangsh/super-simple-software-factory/blob/main/.claude/skills/sssf/SKILL.md
      # pinned to the fork (fix merged to main) until upstream PR disler/super-simple-software-factory#21 merges;
      # after merge, either sync the fork or repoint to disler/super-simple-software-factory

    - name: sssf-sandbox-orchestrator
      description: "Drive the six-phase sandbox mount system from the host — mount throwaway exe.dev VMs, run the Super Simple Software Factory inside them, watch from outside, harvest the commits, tear down. Use when the user says mount a sandbox, run the factory in a sandbox, spin up N sandboxes, best-of-N, check on a run, harvest a run's commits, or tear down. Keywords - sandbox, mount, exe.dev VM, run id, fan out, best-of-N, harvest, bundle, teardown, reap."
      # pinned to the fork: private-repo bundle fill, pass-managed CN provider keys, pi-based gate
      source: https://github.com/yhuangsh/inkwell-agent-sandboxes-and-software-factory/blob/main/.claude/skills/sssf-sandbox-orchestrator/SKILL.md
      requires: [skill:sssf, skill:sandbox-exe-dev]
  agents: []
  prompts: []
